name: helm-chart
api:
  endpoint: http://helm-managed-service.helm-system:3000/api/v1/helm
author: Codesphere
category: Infrastructure
configSchema:
  type: object
  required:
    - repoUrl
    - targetRevision
    - path
  properties:
    repoUrl:
      type: string
      format: uri
      description: Git repository URL containing the Helm chart
      readOnly: false
    targetRevision:
      type: string
      description: Git branch, tag, or commit SHA
      default: main
      readOnly: false
    path:
      type: string
      description: Path to Helm chart within the repository
      readOnly: false
    helmValues:
      type: object
      description: Helm values to override (non-sensitive)
      additionalProperties: true
      readOnly: false
    kubeConfig:
      type: string
      description: Path to kubeconfig file (custom_cluster mode only)
      readOnly: false
    namespace:
      type: string
      description: Target Kubernetes namespace (custom_cluster mode only)
      readOnly: false
detailsSchema:
  type: object
  properties:
    releaseName:
      type: string
      description: Name of the Helm release
    namespace:
      type: string
      description: Kubernetes namespace where the release is deployed
    status:
      type: string
      description: Current status of the Helm release
    lastDeployed:
      type: string
      format: date-time
      description: Timestamp of the last deployment
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the release was created
    updatedAt:
      type: string
      format: date-time
      description: Timestamp of the last update
secretsSchema:
  type: object
  properties:
    sensitiveHelmValues:
      type: object
      description: Sensitive Helm values (passwords, API keys, etc.)
      additionalProperties: true
      format: password
description: |
  Deploy any Helm chart from a Git repository to Kubernetes.
  Supports both shared cluster and custom cluster deployment modes.
  Ideal for deploying containerized applications, databases, and infrastructure components.
displayName: Helm Chart
iconUrl: https://helm.sh/img/helm.svg
plans:
  - id: 0
    name: Standard
    description: Standard Helm deployment
    parameters: {}
version: v1
